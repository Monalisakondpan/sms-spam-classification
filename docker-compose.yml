version: '3.8'

services:
  backend:
    build: ./backend
    container_name: spam-backend-api
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: spam-frontend-ui
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend